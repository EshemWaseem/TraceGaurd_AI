
services:
  db:
    image: postgres:16-alpine
    container_name: traceguard-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceguard_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-traceguard_db}

      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    stop_grace_period: 30s

volumes:
  postgres_data:
    name: traceguard_postgres_data