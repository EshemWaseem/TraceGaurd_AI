apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceguard-backend
  namespace: traceguard
  labels:
    app.kubernetes.io/name: traceguard-backend
    app.kubernetes.io/component: backend
spec:
  # Configured to 1 replica to match the in-memory process-local rate limiter.
  # For multi-replica horizontal scaling, integrate a shared Redis store for rate limiting.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: traceguard-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traceguard-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: traceguard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8010
              name: http
          envFrom:
            - configMapRef:
                name: traceguard-backend-config
            - secretRef:
                name: traceguard-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8010
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
