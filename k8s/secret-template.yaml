apiVersion: v1
kind: Secret
metadata:
  name: traceguard-secrets
  namespace: traceguard
type: Opaque
stringData:
  # Replace with production-grade 64+ char random hex secrets before applying
  SECRET_KEY: "CHANGE_ME_PRODUCTION_SECRET_KEY_MIN_32_CHARS"
  # Standard PostgreSQL URL or Managed Cloud RDS / Cloud SQL
  DATABASE_URL: "postgresql+psycopg://traceguard_user:CHANGE_ME_PASSWORD@traceguard-db:5432/traceguard_db"
  AI_API_KEY: ""
