apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traceguard-ingress
  namespace: traceguard
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: traceguard.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: traceguard-backend-svc
                port:
                  number: 8010
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traceguard-frontend-svc
                port:
                  number: 80
