apiVersion: v1
kind: ConfigMap
metadata:
  name: traceguard-backend-config
  namespace: traceguard
data:
  PROJECT_NAME: "TraceGuard AI"
  VERSION: "1.0.0"
  DEBUG: "false"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  COOKIE_NAME: "traceguard_token"
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: "lax"
